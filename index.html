<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Still Life</title>

  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>

  <main>

    <!-- ================================= -->
    <!-- BUTTERNUT SQUASH -->
    <!-- ================================= -->

    <div id="butternut">
      <div id="butternut-neck"></div>
      <div id="butternut-body"></div>
      <div id="butternut-highlight"></div>
    </div>


    <!-- ================================= -->
    <!-- STRIPED PUMPKIN -->
    <!-- ================================= -->

    <div id="striped-pumpkin">

      <div id="stalk"></div>

      <div id="pumpkin-fruit">

        <div class="pumpkin-ridge ridge1"></div>
        <div class="pumpkin-ridge ridge2"></div>
        <div class="pumpkin-ridge ridge3"></div>
        <div class="pumpkin-ridge ridge4"></div>
        <div class="pumpkin-ridge ridge5"></div>

      </div>

    </div>


    <!-- ================================= -->
    <!-- BANANA -->
    <!-- ================================= -->

    <div id="banana">

      <div id="banana-shadow"></div>

      <div id="banana-body">
        <div id="banana-highlight"></div>
      </div>

      <div id="banana-stem"></div>

      <div id="banana-tip"></div>

    </div>


    <!-- ================================= -->
    <!-- CANDLE -->
    <!-- ================================= -->

    <div id="candle">

      <div id="flame"></div>

      <div id="candle-body"></div>

      <div id="candle-holder"></div>

    </div>


    <!-- ================================= -->
    <!-- BLUE BOTTLE -->
    <!-- ================================= -->

    <div id="bottle">

      <div id="bottle-neck"></div>

      <div id="bottle-lip"></div>

      <div id="bottle-highlight"></div>

    </div>


    <!-- ================================= -->
    <!-- CLOTH -->
    <!-- ================================= -->

    <div id="cloth"></div>


    <!-- ================================= -->
    <!-- TABLE -->
    <!-- ================================= -->

    <div id="table"></div>

  </main>

</body>

</html>
